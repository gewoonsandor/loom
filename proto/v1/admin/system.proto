syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

message SetDefaultWallpaperRequest {
  optional bytes image_data = 1;
}

message SetDefaultWallpaperTextColorRequest {
  string color = 1 [(buf.validate.field).string.pattern = "^#?([A-Fa-f0-9]{3}|[A-Fa-f0-9]{6})$"];
}

service SystemService {
  // Sets the wallpaper served when a contest has none, clearing it when image_data is absent
  rpc SetDefaultWallpaper(SetDefaultWallpaperRequest) returns (google.protobuf.Empty) {}
  // Sets the color of the text displayed on the default wallpaper
  rpc SetDefaultWallpaperTextColor(SetDefaultWallpaperTextColorRequest) returns (google.protobuf.Empty) {}
}
